services:
  postgres:
    image: postgres:17
    container_name: pdf-to-speech-dev-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pdf-to-speech-dev
    volumes:
      - pdf-to-speech-dev-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pdf-to-speech-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - pdf-to-speech-redis-data:/data
    command: redis-server --appendonly yes

volumes:
  pdf-to-speech-dev-data:
  pdf-to-speech-redis-data:
